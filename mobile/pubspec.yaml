# Gavin - Flutter package setup.
# The local assistant requires Dart 3.12 and Android/iOS LiteRT engines.
name: apollens
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  http: ^1.6.0
  audioplayers: ^6.8.1
  flutter_edge_ai: ^2.5.2
  flutter_edge_ai_litertlm: ^1.17.0
  flutter_tts: ^4.2.5
  apple_foundation_models: ^0.5.0
  flutter_onnxruntime: ^1.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/models/
